site_name: Cisco Packet Tracer Lab · বাংলা + English
site_description: Bilingual Cisco labs and v4.0 two-branch ISP-test capstone; 35 English companions, 26 illustrated GIFs. No new verified .pkt.
site_url: https://maksbloxx.github.io/test/
repo_url: https://github.com/MaksBloxX/test
repo_name: MaksBloxX/test
edit_uri: edit/main/
docs_dir: build/docs
site_dir: build/site
use_directory_urls: true
copyright: Educational diagrams and GIFs are conceptual illustrations, not Packet Tracer recordings.

# We stage the repository instead of duplicating maintained Markdown under docs/.
theme:
  name: material
  language: bn
  font: false
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - toc.follow
  palette:
    - scheme: default
      primary: blue grey
      accent: teal
      toggle:
        icon: material/weather-night
        name: Dark mode
    - scheme: slate
      primary: blue grey
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: Light mode

plugins:
  - search:
      lang: en  # English stemming; Bengali words remain searchable as Unicode terms.
      separator: '[\s\-\u0964]+'

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.tasklist:
      custom_checkbox: true

extra_css:
  - portal/assets/css/portal.css
extra_javascript:
  - portal/assets/js/language.js

