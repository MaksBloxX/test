" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" fill="#087F6C" font-weight="750">03</text><text x="841" y="206" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" fill="#1C344D" font-weight="750">Shared printer</text><text x="780" y="245" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" fill="#556B82" font-weight="500">DHCP PCs + static printer</text><text x="780" y="272" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" fill="#556B82" font-weight="500">Exclude the printer IP</text><text x="129" y="362" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" fill="#AF6B0A" font-weight="750">04</text><text x="129" y="389" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" fill="#1C344D" font-weight="750">IP subnet tester</text><text x="68" y="428" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" fill="#556B82" font-weight="500">One switch, four hosts</text><text x="68" y="455" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" fill="#556B82" font-weight="500">Prove the /26 boundary</text><text x="485" y="362" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" fill="#2467B2" font-weight="750">05</text><text x="485" y="389" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" fill="#1C344D" font-weight="750">Six topologies</text><text x="424" y="428" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" fill="#556B82" font-weight="500">Bus, star, ring, mesh...</text><text x="424" y="455" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" fill="#556B82" font-weight="500">Compare actual .pkt layouts</text><text x="841" y="362" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" fill="#BF4A52" font-weight="750">06</text><text x="841" y="389" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-size="19.2" fill="#1C344D" font-weight="750">Broken lab detective</text><text x="780" y="428" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" fill="#556B82" font-weight="500">Inject one fault at a time</text><text x="780" y="455" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" fill="#556B82" font-weight="500">Observe → repair → verify</text><text x="307" y="545" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" fill="#7452AD" font-weight="750">07</text><text x="307" y="572" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" fill="#1C344D" font-weight="750">VoIP IP telephony</text><text x="246" y="611" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" fill="#556B82" font-weight="500">2811 CME + two 7960s</text><text x="246" y="638" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" fill="#556B82" font-weight="500">Voice VLAN and option 150</text><text x="663" y="545" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" fill="#087F6C" font-weight="750">08</text><text x="663" y="572" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" fill="#1C344D" font-weight="750">DHCP Snooping + DAI</text><text x="602" y="611" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" fill="#556B82" font-weight="500">Trust only server uplink</text><text x="602" y="638" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" fill="#556B82" font-weight="500">DAI behavior may differ in PT</text><text x="40" y="46" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-size="29" fill="#FFFFFF" font-weight="750">Eight extra labs | from servers to security</text><text x="41" y="76" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" fill="#D4E3EF" font-weight="450">Open existing .pkt examples, or build the later labs from their illustrated guides.</text><rect x="904" y="29" width="175" height="42" rx="21" fill="#214563" stroke="none" stroke-width="1.5"/><text x="991" y="56" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="13.3" fill="#FFFFFF" font-weight="700">EXTRA LAB INDEX</text><rect x="0" y="727" width="1120" height="68" rx="0" fill="#EAF0F6" stroke="none" stroke-width="1.5"/><rect x="40" y="744" width="4" height="32" rx="2" fill="#087F6C" stroke="none" stroke-width="1.5"/><text x="57" y="766" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" fill="#1C344D" font-weight="540">Extras 07 and 08 are new build-alongs, not downloadable Packet Tracer projects.</text></svg>
