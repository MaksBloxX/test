xt><circle cx="270.0" cy="355.0" r="5.3" fill="#087F6C" stroke="none" stroke-width="1"/><circle cx="472.0" cy="355.0" r="5.3" fill="#087F6C" stroke="none" stroke-width="1"/><circle cx="648.0" cy="355.0" r="5.3" fill="#087F6C" stroke="none" stroke-width="1"/><circle cx="844.0" cy="355.0" r="5.3" fill="#087F6C" stroke="none" stroke-width="1"/><text x="92" y="204" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" fill="#2467B2" font-weight="750">1  ARP REQUEST · broadcast</text><text x="92" y="232" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-size="15.5" fill="#1C344D" font-weight="500">Who has 192.168.1.20?</text><text x="92" y="255" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-size="15.5" fill="#1C344D" font-weight="500">Sent to FF:FF:FF:FF:FF:FF</text><text x="589" y="204" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" fill="#7452AD" font-weight="750">2  ARP REPLY · unicast</text><text x="589" y="232" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-size="15.5" fill="#1C344D" font-weight="500">.20 is at MAC BB:BB</text><text x="589" y="255" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-size="15.5" fill="#1C344D" font-weight="500">PC0 caches IP → MAC mapping</text><rect x="368.0" y="436" width="374" height="30" rx="15" fill="#E5F5EF" stroke="none" stroke-width="1.5"/><text x="555" y="457" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="13.5" fill="#087F6C" font-weight="700">NOW PC0 CAN SEND AN ETHERNET FRAME</text><text x="40" y="46" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-size="29" fill="#FFFFFF" font-weight="750">CCNA 03 | ARP resolves a local IP to a MAC</text><text x="41" y="76" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" fill="#D4E3EF" font-weight="450">To send a unicast IP packet on a LAN, first find the next-hop MAC.</text><rect x="904" y="29" width="175" height="42" rx="21" fill="#214563" stroke="none" stroke-width="1.5"/><text x="991" y="56" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="13.3" fill="#FFFFFF" font-weight="700">ARP SEQUENCE</text><rect x="0" y="622" width="1120" height="68" rx="0" fill="#EAF0F6" stroke="none" stroke-width="1.5"/><rect x="40" y="639" width="4" height="32" rx="2" fill="#087F6C" stroke="none" stroke-width="1.5"/><text x="57" y="661" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" fill="#1C344D" font-weight="540">ARP request: broadcast. ARP reply: unicast. The switch also learns the source MAC on each port.</text></svg>
