<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="620" viewBox="0 0 1120 620" role="img" aria-label="OSI book | from search to screen"><title>OSI book | from search to screen</title><desc>The browser request is packaged, routed and unpacked before results appear.. DNS finds an address; transport, IP and Ethernet carry the request; the server replies in reverse.</desc><defs><pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#DFE7EE"/></pattern><marker id="arrow-teal" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0 1 L9 5 L0 9 Z" fill="#087F6C"/></marker><marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0 1 L9 5 L0 9 Z" fill="#2467B2"/></marker><marker id="arrow-violet" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0 1 L9 5 L0 9 Z" fill="#7452AD"/></marker><marker id="arrow-amber" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0 1 L9 5 L0 9 Z" fill="#AF6B0A"/></marker><marker id="arrow-red" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0 1 L9 5 L0 9 Z" fill="#BF4A52"/></marker><marker id="arrow-navy" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0 1 L9 5 L0 9 Z" fill="#142B46"/></marker></defs><rect width="1120" height="620" fill="#F8FAFD"/><rect x="0" y="103" width="1120" height="449" fill="url(#dots)"/><rect x="0" y="0" width="1120" height="103" fill="#142B46"/><rect x="0" y="100" width="1120" height="4" fill="#087F6C"/><path d="M230.0 321.0 L245.0 321.0" fill="none" stroke="#2467B2" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-blue)"/><path d="M444.0 321.0 L459.0 321.0" fill="none" stroke="#087F6C" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-teal)"/><path d="M658.0 321.0 L673.0 321.0" fill="none" stroke="#7452AD" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-violet)"/><path d="M872.0 321.0 L887.0 321.0" fill="none" stroke="#AF6B0A" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-amber)"/><rect x="37.0" y="200" width="190" height="239" rx="19" fill="#FFFFFF" stroke="#D6E2EC" stroke-width="1.5"/><rect x="37.0" y="200" width="190" height="7" rx="3" fill="#2467B2" stroke="none" stroke-width="1.5"/><circle cx="74.0" cy="242" r="21" fill="#2467B2" stroke="none" stroke-width="1"/><rect x="251.0" y="200" width="190" height="239" rx="19" fill="#FFFFFF" stroke="#D6E2EC" stroke-width="1.5"/><rect x="251.0" y="200" width="190" height="7" rx="3" fill="#087F6C" stroke="none" stroke-width="1.5"/><circle cx="288.0" cy="242" r="21" fill="#087F6C" stroke="none" stroke-width="1"/><rect x="465.0" y="200" width="190" height="239" rx="19" fill="#FFFFFF" stroke="#D6E2EC" stroke-width="1.5"/><rect x="465.0" y="200" width="190" height="7" rx="3" fill="#7452AD" stroke="none" stroke-width="1.5"/><circle cx="502.0" cy="242" r="21" fill="#7452AD" stroke="none" stroke-width="1"/><rect x="679.0" y="200" width="190" height="239" rx="19" fill="#FFFFFF" stroke="#D6E2EC" stroke-width="1.5"/><rect x="679.0" y="200" width="190" height="7" rx="3" fill="#AF6B0A" stroke="none" stroke-width="1.5"/><circle cx="716.0" cy="242" r="21" fill="#AF6B0A" stroke="none" stroke-width="1"/><rect x="893.0" y="200" width="190" height="239" rx="19" fill="#FFFFFF" stroke="#D6E2EC" stroke-width="1.5"/><rect x="893.0" y="200" width="190" height="7" rx="3" fill="#087F6C" stroke="none" stroke-width="1.5"/><circle cx="930.0" cy="242" r="21" fill="#087F6C" stroke="none" stroke-width="1"/><text x="74.0" y="249" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" fill="white" font-weight="750">1</text><text x="58.0" y="305" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" fill="#1C344D" font-weight="750">Browser</text><text x="58.0" y="349" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-size="14.3" fill="#556B82" font-weight="500">Search text becomes</text><text x="58.0" y="380" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.3" fill="#556B82" font-weight="500">an application request</text><text x="288.0" y="249" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" fill="white" font-weight="750">2</text><text x="272.0" y="305" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" fill="#1C344D" font-weight="750">DNS lookup</text><text x="272.0" y="349" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-size="15.5" fill="#556B82" font-weight="500">Name → server IP</text><text x="272.0" y="380" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.3" fill="#556B82" font-weight="500">Resolver returns an IP</text><text x="502.0" y="249" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" fill="white" font-weight="750">3</text><text x="486.0" y="305" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" fill="#1C344D" font-weight="750">Send packets</text><text x="486.0" y="349" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-size="13.6" fill="#556B82" font-weight="500">TCP/TLS + IP + frame</text><text x="486.0" y="380" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#556B82" font-weight="500">Bits cross each local link</text><text x="716.0" y="249" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" fill="white" font-weight="750">4</text><text x="700.0" y="305" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" fill="#1C344D" font-weight="750">Web server</text><text x="700.0" y="349" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.3" fill="#556B82" font-weight="500">Processes HTTP request</text><text x="700.0" y="380" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-size="15.1" fill="#556B82" font-weight="500">Returns a response</text><text x="930.0" y="249" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" fill="white" font-weight="750">5</text><text x="914.0" y="305" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" fill="#1C344D" font-weight="750">Render page</text><text x="914.0" y="349" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-size="14.3" fill="#556B82" font-weight="500">Decode the response</text><text x="914.0" y="380" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.9" fill="#556B82" font-weight="500">Browser shows results</text><text x="40" y="46" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-size="29" fill="#FFFFFF" font-weight="750">OSI book | from search to screen</text><text x="41" y="76" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" fill="#D4E3EF" font-weight="450">The browser request is packaged, routed and unpacked before results appear.</text><rect x="904" y="29" width="175" height="42" rx="21" fill="#214563" stroke="none" stroke-width="1.5"/><text x="991" y="56" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="13.3" fill="#FFFFFF" font-weight="700">SEVEN-LAYER JOURNEY</text><rect x="0" y="552" width="1120" height="68" rx="0" fill="#EAF0F6" stroke="none" stroke-width="1.5"/><rect x="40" y="569" width="4" height="32" rx="2" fill="#087F6C" stroke="none" stroke-width="1.5"/><text x="57" y="591" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" fill="#1C344D" font-weight="540">DNS finds an address; transport, IP and Ethernet carry the request; the server replies in reverse.</text></svg>
