troke="white" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="129" y="184" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" fill="#087F6C" font-weight="750">DAYS 01-05</text><text x="129" y="211" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" fill="#1C344D" font-weight="750">Network + first CLI</text><text x="68" y="250" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" fill="#556B82" font-weight="500">LAN, OSI and Router modes</text><text x="68" y="277" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" fill="#556B82" font-weight="500">Finish: first successful ping</text><text x="485" y="184" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" fill="#2467B2" font-weight="750">DAYS 06-12</text><text x="485" y="211" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" fill="#1C344D" font-weight="750">IP + static routes</text><text x="424" y="250" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" fill="#556B82" font-weight="500">IPv4, subnetting and /30 WAN</text><text x="424" y="277" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" fill="#556B82" font-weight="500">Finish: two LANs communicate</text><text x="841" y="184" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" fill="#7452AD" font-weight="750">DAYS 13-18</text><text x="841" y="211" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" fill="#1C344D" font-weight="750">Network services</text><text x="780" y="250" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" fill="#556B82" font-weight="500">DHCP, DNS, web, FTP, email</text><text x="780" y="277" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" fill="#556B82" font-weight="500">Finish: test each server</text><text x="129" y="384" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" fill="#AF6B0A" font-weight="750">DAYS 19-23</text><text x="129" y="411" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" fill="#1C344D" font-weight="750">VLAN + switching</text><text x="68" y="450" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" fill="#556B82" font-weight="500">Trunk, ROAS, STP and LACP</text><text x="68" y="477" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" fill="#556B82" font-weight="500">Finish: inter-VLAN access</text><text x="485" y="384" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" fill="#2467B2" font-weight="750">DAYS 24-27</text><text x="485" y="411" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" fill="#1C344D" font-weight="750">Enterprise features</text><text x="424" y="450" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" fill="#556B82" font-weight="500">OSPF, Wi-Fi, SSH, NTP, Syslog</text><text x="424" y="477" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" fill="#556B82" font-weight="500">Finish: secure and observe</text><text x="841" y="384" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" fill="#087F6C" font-weight="750">DAYS 28-30</text><text x="841" y="411" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" fill="#1C344D" font-weight="750">Capstone + review</text><text x="780" y="450" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" fill="#556B82" font-weight="500">Build an office or campus LAN</text><text x="780" y="477" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" fill="#556B82" font-weight="500">Finish: verify, explain, repair</text><text x="40" y="46" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-size="29" fill="#FFFFFF" font-weight="750">30-day learning path</text><text x="41" y="76" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" fill="#D4E3EF" font-weight="450">Six stages from your first network to a working capstone.</text><rect x="904" y="29" width="175" height="42" rx="21" fill="#214563" stroke="none" stroke-width="1.5"/><text x="991" y="56" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="13.3" fill="#FFFFFF" font-weight="700">30-DAY PLAN</text><rect x="0" y="622" width="1120" height="68" rx="0" fill="#EAF0F6" stroke="none" stroke-width="1.5"/><rect x="40" y="639" width="4" height="32" rx="2" fill="#087F6C" stroke="none" stroke-width="1.5"/><text x="57" y="661" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" fill="#1C344D" font-weight="540">The roadmap has daily tasks and a 7-day exam-week shortcut; the stages here are a visual summary.</text></svg>
