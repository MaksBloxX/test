e" stroke-linecap="round" stroke-linejoin="round"/><path d="M791.0 553.0 L786.0 553.0" stroke="white" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M794.2 545.2 L790.7 541.7" stroke="white" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M802.0 542.0 L802.0 537.0" stroke="white" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M809.8 545.2 L813.3 541.7" stroke="white" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="129" y="179" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" fill="#087F6C" font-weight="750">01</text><text x="129" y="206" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" fill="#1C344D" font-weight="750">Reachability</text><text x="68" y="245" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" fill="#556B82" font-weight="500">ping · traceroute · mtr</text><text x="68" y="272" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" fill="#556B82" font-weight="500">Is the host reachable?</text><text x="485" y="179" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" fill="#2467B2" font-weight="750">02</text><text x="485" y="206" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" fill="#1C344D" font-weight="750">Address + interface</text><text x="424" y="245" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" fill="#556B82" font-weight="500">ip · ifconfig · ipconfig</text><text x="424" y="272" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" fill="#556B82" font-weight="500">Which IP and mask are set?</text><text x="841" y="179" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" fill="#7452AD" font-weight="750">03</text><text x="841" y="206" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" fill="#1C344D" font-weight="750">Routes + neighbors</text><text x="780" y="245" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" fill="#556B82" font-weight="500">ip route · arp · ip neigh</text><text x="780" y="272" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" fill="#556B82" font-weight="500">Where is the next hop?</text><text x="129" y="362" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" fill="#AF6B0A" font-weight="750">04</text><text x="129" y="389" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" fill="#1C344D" font-weight="750">Name resolution</text><text x="68" y="428" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" fill="#556B82" font-weight="500">dig · nslookup · host</text><text x="68" y="455" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" fill="#556B82" font-weight="500">What address does DNS return?</text><text x="485" y="362" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" fill="#2467B2" font-weight="750">05</text><text x="485" y="389" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" fill="#1C344D" font-weight="750">Sockets + ports</text><text x="424" y="428" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" fill="#556B82" font-weight="500">ss · netstat · nmap</text><text x="424" y="455" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" fill="#556B82" font-weight="500">Which service is listening?</text><text x="841" y="362" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" fill="#087F6C" font-weight="750">06</text><text x="841" y="389" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" fill="#1C344D" font-weight="750">Remote access</text><text x="780" y="428" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" fill="#556B82" font-weight="500">ssh · scp · curl</text><text x="780" y="455" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" fill="#556B82" font-weight="500">Can you connect / transfer?</text><text x="129" y="545" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" fill="#7452AD" font-weight="750">07</text><text x="129" y="572" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" fill="#1C344D" font-weight="750">Packets on wire</text><text x="68" y="611" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" fill="#556B82" font-weight="500">tcpdump · Wireshark</text><text x="68" y="638" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" fill="#556B82" font-weight="500">What did the network send?</text><text x="485" y="545" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" fill="#BF4A52" font-weight="750">08</text><text x="485" y="572" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" fill="#1C344D" font-weight="750">Firewall + policy</text><text x="424" y="611" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" fill="#556B82" font-weight="500">iptables · ufw · netsh</text><text x="424" y="638" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" fill="#556B82" font-weight="500">What blocks this connection?</text><text x="841" y="545" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" fill="#AF6B0A" font-weight="750">09</text><text x="841" y="572" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" fill="#1C344D" font-weight="750">Performance</text><text x="780" y="611" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" fill="#556B82" font-weight="500">iperf3 · speedtest</text><text x="780" y="638" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" fill="#556B82" font-weight="500">Is it latency or throughput?</text><text x="40" y="46" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-size="29" fill="#FFFFFF" font-weight="750">30 practical commands | what are you testing?</text><text x="41" y="76" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" fill="#D4E3EF" font-weight="450">Group commands by the evidence you need, not by the operating system you use.</text><rect x="904" y="29" width="175" height="42" rx="21" fill="#214563" stroke="none" stroke-width="1.5"/><text x="991" y="56" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="13.3" fill="#FFFFFF" font-weight="700">COMMAND TOOLKIT</text><rect x="0" y="727" width="1120" height="68" rx="0" fill="#EAF0F6" stroke="none" stroke-width="1.5"/><rect x="40" y="744" width="4" height="32" rx="2" fill="#087F6C" stroke="none" stroke-width="1.5"/><text x="57" y="766" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" fill="#1C344D" font-weight="540">The book provides five real examples and platform notes per command; these are quick category cues.</text></svg>
