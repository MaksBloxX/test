<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="895" viewBox="0 0 1120 895" role="img" aria-label="v4.0 | test the paths, then create your own .pkt"><title>v4.0 | test the paths, then create your own .pkt</title><desc>Expected tests are study predictions until you run Packet Tracer yourself.. Web public IP changes after HQ1 power-off: use HQ2 .5; no automatic public IP failover.</desc><defs><pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#DFE7EE"/></pattern><marker id="arrow-teal" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0 1 L9 5 L0 9 Z" fill="#087F6C"/></marker><marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0 1 L9 5 L0 9 Z" fill="#2467B2"/></marker><marker id="arrow-violet" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0 1 L9 5 L0 9 Z" fill="#7452AD"/></marker><marker id="arrow-amber" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0 1 L9 5 L0 9 Z" fill="#AF6B0A"/></marker><marker id="arrow-red" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0 1 L9 5 L0 9 Z" fill="#BF4A52"/></marker><marker id="arrow-navy" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0 1 L9 5 L0 9 Z" fill="#142B46"/></marker></defs><rect width="1120" height="895" fill="#F8FAFD"/><rect x="0" y="103" width="1120" height="724" fill="url(#dots)"/><rect x="0" y="0" width="1120" height="103" fill="#142B46"/><rect x="0" y="100" width="1120" height="4" fill="#087F6C"/><rect x="48" y="140" width="1024" height="113" rx="15" fill="#E7F0FA" stroke="#2467B255" stroke-width="1.5"/><rect x="48" y="140" width="6" height="113" rx="2" fill="#2467B2" stroke="none" stroke-width="1.5"/><rect x="48" y="276" width="1024" height="113" rx="15" fill="#F0EBFA" stroke="#7452AD55" stroke-width="1.5"/><rect x="48" y="276" width="6" height="113" rx="2" fill="#7452AD" stroke="none" stroke-width="1.5"/><rect x="48" y="412" width="1024" height="113" rx="15" fill="#E5F5EF" stroke="#087F6C55" stroke-width="1.5"/><rect x="48" y="412" width="6" height="113" rx="2" fill="#087F6C" stroke="none" stroke-width="1.5"/><rect x="48" y="548" width="1024" height="113" rx="15" fill="#FFF4DC" stroke="#AF6B0A55" stroke-width="1.5"/><rect x="48" y="548" width="6" height="113" rx="2" fill="#AF6B0A" stroke="none" stroke-width="1.5"/><rect x="48" y="684" width="1024" height="113" rx="15" fill="#E7F0FA" stroke="#2467B255" stroke-width="1.5"/><rect x="48" y="684" width="6" height="113" rx="2" fill="#2467B2" stroke="none" stroke-width="1.5"/><text x="68" y="170" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" fill="#2467B2" font-weight="750">01 | Private services</text><text x="68" y="198" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-size="15.5" fill="#1C344D" font-weight="500">BR1-PC -&gt; OSPF -&gt; HQ DMZ Web/DNS/Mail/FTP</text><text x="68" y="221" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-size="15.5" fill="#1C344D" font-weight="500">Use 10.10.40.x; ISP does not route the private LANs.</text><text x="68" y="306" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" fill="#7452AD" font-weight="750">02 | Wi-Fi and ACL</text><text x="68" y="334" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-size="15.5" fill="#1C344D" font-weight="500">BR2 laptop: DNS 10.10.40.10 + HTTP 10.10.40.20 allowed</text><text x="68" y="357" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-size="15.5" fill="#1C344D" font-weight="500">HQ ADMIN 10.10.99.10 and other DMZ ports denied; check ACL counters.</text><text x="68" y="442" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" fill="#087F6C" font-weight="750">03 | PAT to test ISP</text><text x="68" y="470" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-size="15.5" fill="#1C344D" font-weight="500">BR1/HQ client -&gt; HQ1 PAT 198.51.100.1 -&gt; ISP Lo0 192.0.2.100/32</text><text x="68" y="493" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-size="15.5" fill="#1C344D" font-weight="500">Test the documentation-only loopback; not public Internet access.</text><text x="68" y="578" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" fill="#AF6B0A" font-weight="750">04 | HQ1 powered OFF</text><text x="68" y="606" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-size="15.5" fill="#1C344D" font-weight="500">HQ2 HSRP active + branch floating defaults + HQ2 PAT</text><text x="68" y="629" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-size="15.5" fill="#1C344D" font-weight="500">Retest private routes, outside ping and public HTTP on 198.51.100.5.</text><text x="68" y="714" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" fill="#2467B2" font-weight="750">05 | Voice evidence</text><text x="68" y="742" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-size="15.5" fill="#1C344D" font-weight="500">HQ phones: option 150 -&gt; CME 10.10.20.10</text><text x="68" y="765" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-size="15.5" fill="#1C344D" font-weight="500">Verify screens 1001/1002, then ring/answer; no real PSTN audio.</text><text x="40" y="46" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-size="29" fill="#FFFFFF" font-weight="750">v4.0 | test the paths, then create your own .pkt</text><text x="41" y="76" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" fill="#D4E3EF" font-weight="450">Expected tests are study predictions until you run Packet Tracer yourself.</text><rect x="904" y="29" width="175" height="42" rx="21" fill="#214563" stroke="none" stroke-width="1.5"/><text x="991" y="56" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="13.3" fill="#FFFFFF" font-weight="700">VERIFICATION PLAN</text><rect x="0" y="827" width="1120" height="68" rx="0" fill="#EAF0F6" stroke="none" stroke-width="1.5"/><rect x="40" y="844" width="4" height="32" rx="2" fill="#087F6C" stroke="none" stroke-width="1.5"/><text x="57" y="866" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" fill="#1C344D" font-weight="540">Web public IP changes after HQ1 power-off: use HQ2 .5; no automatic public IP failover.</text></svg>
