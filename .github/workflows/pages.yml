name: Build and publish v4.0 bilingual MkDocs portal

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Check English, GIFs, v4 capstone and strict site build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-docs.txt
      - name: Install optional website dependencies
        run: python3 -m pip install -r requirements-docs.txt
      - name: Check English adaptations, original GIF media, capstone source and links
        run: |
          python3 scripts/english_track_generator.py --check
          python3 scripts/gif_walkthrough_generator.py --check
          python3 scripts/diagram_generator.py --check
          python3 scripts/capstone_config_generator.py --check
          python3 scripts/repo_doctor.py --strict
      - name: Build multilingual portal strictly
        run: |
          python3 scripts/portal_docs.py
          python3 scripts/portal_docs.py --check
          python3 -m mkdocs build --strict -f mkdocs.yml
      - name: Run offline regression tests (not Packet Tracer execution)
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Upload Pages artifact on main only
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/site

  deploy:
    name: Deploy after main build (maintainer must enable Pages)
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
