name: Repository Health & Scripts Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  audit-and-test:
    name: Validate Markdown Links, Assets & CLI Tools
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install optional docs and GIF check dependencies
        run: python3 -m pip install -r requirements-docs.txt

      - name: Check all SVG, v4 role configs, English adaptations and 30-second GIFs
        run: |
          python3 scripts/diagram_generator.py --check
          python3 scripts/capstone_config_generator.py --check
          python3 scripts/english_track_generator.py --check
          python3 scripts/gif_walkthrough_generator.py --check

      - name: Run Repository Doctor (Links, Anchors, Code Fences & Local Images)
        run: python3 scripts/repo_doctor.py --strict

      - name: Smoke-test Subnet & VLSM Calculator
        run: |
          python3 scripts/subnet_calculator.py 192.168.1.65/26
          python3 scripts/subnet_calculator.py --vlsm 192.168.10.0/24 --departments "CSE:55,EEE:25,WAN:2"
          python3 scripts/subnet_calculator.py --drill 3 --seed 42

      - name: Smoke-test Cisco IOS Config Generator (v3.0)
        run: |
          python3 scripts/ios_config_generator.py --list
          python3 scripts/ios_config_generator.py roas --with-dhcp > /dev/null
          python3 scripts/ios_config_generator.py ospf > /dev/null
          python3 scripts/ios_config_generator.py ssh-hardening > /dev/null
          python3 scripts/ios_config_generator.py broken-lab --case 5 > /dev/null
          python3 scripts/ios_config_generator.py svi-switch > /dev/null
          python3 scripts/ios_config_generator.py hsrp --role R3 > /dev/null
          python3 scripts/ios_config_generator.py ipv6-static --role R2 > /dev/null
          python3 scripts/ios_config_generator.py ospfv3 --role R1 > /dev/null
          python3 scripts/ios_config_generator.py voip-cme --role SW1 > /dev/null
          python3 scripts/ios_config_generator.py dhcp-snooping --role SW1 > /dev/null
          python3 scripts/ios_config_generator.py dai --role SW1 > /dev/null

      - name: Smoke-test nine role-separated v4 snippets (text only, no simulator)
        run: |
          python3 scripts/capstone_config_generator.py --list
          python3 scripts/capstone_config_generator.py --role HQ1 > /dev/null
          python3 scripts/capstone_config_generator.py --role BR2 > /dev/null
      - name: Test v3 CLI, v3.5 portal and v4 capstone offline regressions
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v

      - name: Smoke-test Lab Writer & CCNA Quiz Trainer
        run: |
          python3 scripts/lab_writer.py lesson --num 99 --slug sample --title "Sample Lesson" --stdout > /dev/null
          python3 scripts/quiz_trainer.py --list
          python3 scripts/quiz_trainer.py --demo
